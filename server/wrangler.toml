name = "genesys-rooms"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Durable Objects hold one room each: the lobby, the tick clock and the
# command relay all live in a single object, so no external state is needed.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are the kind the Cloudflare free plan allows,
# so this must stay `new_sqlite_classes` rather than `new_classes`.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Allow the GitHub Pages origin to open a socket. Override with your own.
[vars]
ALLOWED_ORIGINS = "*"
