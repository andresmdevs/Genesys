# Requires GitHub Actions to be available on the account. If runs fail with
# "your account is locked due to a billing issue", the checks still run
# locally with `npm test` and `npm run build`, and publishing the site does
# not depend on Actions at all - see `npm run deploy`.
name: CI

on:
  push:
    branches-ignore:
      - main
      - claude/peaceful-babbage-grobkj
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
